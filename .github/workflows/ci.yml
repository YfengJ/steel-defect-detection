name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Lint maintained Python files
        run: >-
          python -m ruff check
          train.py predict.py val.py video_predict.py translate.py ui.py setup.py
          path_validation.py process_runner.py scripts tests
          --ignore F403,F405

      - name: Run focused tests
        run: python -m pytest tests -q

      - name: Check repository hygiene
        run: python scripts/check_repository_hygiene.py

      - name: Compile Python files
        run: python -m compileall .
