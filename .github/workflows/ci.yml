name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Lint maintained Python files
        run: >-
          python -m ruff check
          train.py predict.py val.py video_predict.py path_validation.py
          scripts tests

      - name: Check repository hygiene
        run: python scripts/check_repository_hygiene.py

      - name: Run focused tests
        run: >-
          python -m pytest
          tests/test_repository_hygiene.py
          tests/test_path_validation.py
          tests/test_dependency_contracts.py
          -q

      - name: Run CLI smoke tests
        run: python tests/test_cli_smoke.py

      - name: Compile Python files
        run: python -m compileall .
