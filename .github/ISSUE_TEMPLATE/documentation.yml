name: Documentation
description: Report missing, confusing, or outdated documentation.
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: dropdown
    id: doc
    attributes:
      label: Document
      options:
        - README.md
        - docs/macos.md
        - docs/dataset.md
        - docs/troubleshooting.md
        - ROADMAP.md
        - Other
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What should change?
      description: Describe the missing, confusing, or incorrect documentation.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested wording
      description: Optional draft text or links to authoritative references.
    validations:
      required: false
