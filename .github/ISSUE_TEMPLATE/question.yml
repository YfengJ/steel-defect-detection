name: Question
description: Ask for help using this steel defect detection project.
title: "[Question]: "
labels: [question]
body:
  - type: markdown
    attributes:
      value: |
        Please include enough context for maintainers to understand your environment and dataset layout.

  - type: checkboxes
    attributes:
      label: Search before asking
      description: >
        Please search this repository's issues before opening a new question.
      options:
        - label: >
            I have searched existing issues and found no similar question.
          required: true

  - type: textarea
    attributes:
      label: Question
      description: What is your question?
      placeholder: |
        Include your command, operating system, Python version, device, and any relevant error output.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Additional
      description: Anything else you would like to share?
