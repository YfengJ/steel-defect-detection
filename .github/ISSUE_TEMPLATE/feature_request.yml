name: Feature request
description: Suggest a scoped improvement for the steel defect detection workflow.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-checks
      options:
        - label: I searched existing issues and did not find the same request.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this feature solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the smallest useful version of the feature.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Dataset
        - Training
        - Validation
        - Prediction
        - GUI
        - CI / maintenance
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add examples, screenshots, or related links if helpful.
    validations:
      required: false
